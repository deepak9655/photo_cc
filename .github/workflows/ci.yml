name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The engine is plain Kotlin with no Android dependencies, so it runs as a
  # normal JVM program: real Photoshop files in, byte-level checks out.
  engine:
    name: Engine tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The engine is plain Kotlin with no Android imports, so CI runs the *same*
      # script a developer runs locally — including the AWT-backed text support
      # that the Gradle task cannot reach without a device/emulator. Getting the
      # compiler from npm keeps the runner free of SDK downloads.
      - name: Install the Kotlin compiler
        run: npm install --prefix .kotlin --no-audit --no-fund kotlin-compiler

      # Real Photoshop files (third-party sample corpus, not stored in the repo)
      # plus the reference values the Kotlin reader is compared against.
      - name: Fetch PSD fixtures and reference values
        run: |
          node tools/engine/fetch-fixtures.mjs
          cd tools/engine
          npm ci --no-audit --no-fund
          node compare-read.mjs

      - name: Engine self-test + independent cross-check
        run: |
          export PHOTO_CC_KC="$PWD/.kotlin/node_modules/kotlin-compiler/bin/kotlinc"
          export PHOTO_CC_STDLIB="$PWD/.kotlin/node_modules/kotlin-compiler/lib/kotlin-stdlib.jar"
          bash tools/engine-test.sh

      - name: Upload test artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-artifacts
          path: build/engine-test/
          if-no-files-found: ignore

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK (side-loadable as-is)
        run: gradle :app:assembleDebug --no-daemon

      - name: Sign release APK when a keystore is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTO_CC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PHOTO_CC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHOTO_CC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHOTO_CC_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export PHOTO_CC_KEYSTORE="$RUNNER_TEMP/release.keystore"
            export PHOTO_CC_STORE_PASSWORD="$STORE_PASSWORD"
            export PHOTO_CC_KEY_ALIAS="${KEY_ALIAS:-photocc}"
            export PHOTO_CC_KEY_PASSWORD="$KEY_PASSWORD"
            gradle :app:assembleRelease --no-daemon
            echo "release APK built and signed"
          else
            echo "No keystore secret configured: building an unsigned release APK"
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Collect APKs
        run: |
          mkdir -p apk
          find app/build/outputs/apk -name '*.apk' -exec cp {} apk/ \;
          ls -lh apk

      - uses: actions/upload-artifact@v4
        with:
          name: photocc-apk
          path: apk/*.apk

  web:
    name: Web companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Round-trip + UI smoke tests
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Production build
        working-directory: web
        run: npx vite build

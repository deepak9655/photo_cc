name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: engine tests (plain JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the Kotlin compiler
        run: |
          curl -sSL -o kotlin-compiler.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin-compiler.zip

      - name: Compile and run the engine tests
        run: bash tools/engine-test.sh kotlinc/bin/kotlinc kotlinc/lib/kotlin-stdlib.jar

  apk:
    name: debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the debug APK
        run: gradle --no-daemon assembleDebug

      - name: Say what was built
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: strata-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

# Strata is built on framework APIs only: no AndroidX, no third-party runtime
# dependencies. That keeps the APK small and start-up instant, and it means the
# whole image engine can be compiled and tested on a desktop JVM.
android.useAndroidX=false
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
